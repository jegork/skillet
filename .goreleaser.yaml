version: 2

project_name: skillet

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/skillet
    binary: skillet
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# goreleaser ships plain binaries to a tap as casks; the post-install hook
# clears the quarantine bit since the binary is not notarized
homebrew_casks:
  - repository:
      owner: jegork
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/jegork/skillet
    description: Terminal UI for managing agent skills across Claude Code, Codex and omp
    license: MIT
    commit_msg_template: "chore: skillet {{ .Tag }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/skillet"]
          end

# release-please owns the notes and the GitHub release; goreleaser only
# attaches the binaries
changelog:
  disable: true

release:
  mode: keep-existing
  github:
    owner: jegork
    name: skillet
