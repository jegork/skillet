version: 2

project_name: skillet

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/skillet
    binary: skillet
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# release-please owns the notes and the GitHub release; goreleaser only
# attaches the binaries
changelog:
  disable: true

release:
  mode: keep-existing
  github:
    owner: jegork
    name: skillet
